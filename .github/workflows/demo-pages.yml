name: Live demo (GitHub Pages)

# Publishes the no-server demo build (sample data, Direct UPI) to https://<user>.github.io/<repo>/
on:
  push: { branches: [main], paths: ['frontend/**', '.github/workflows/demo-pages.yml'] }
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build single-file demo
        working-directory: frontend
        run: npm ci && npm run build:demo && touch dist-demo/.nojekyll
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist-demo
          publish_branch: gh-pages
